[project]
name = "trove-sdk"
version = "0.1.1"
description = "Python SDK for Trove — managed POSIX filesystem for AI agents"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://trovefiles.dev"
Repository = "https://github.com/CFO-Silvia/trove-sdk"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trove_sdk"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
