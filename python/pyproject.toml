[project]
name = "trove-sdk"
version = "0.9.2"
description = "Python SDK for Trove — files and commands for AI agents"
readme = "README.md"
license = "MIT"
authors = [
    { name = "TroveFiles", email = "support@trovefiles.dev" },
]
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
cli = [
    "click>=8.1",
    "rich>=13",
]
mcp = [
    "mcp>=1.0",
]

[project.scripts]
trove = "trove_sdk.cli:main"
trove-mcp = "trove_sdk.mcp.server:main"

[project.urls]
Homepage = "https://trovefiles.dev"
Repository = "https://github.com/CFO-Silvia/trove-sdk"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trove_sdk"]

[dependency-groups]
dev = [
    "pillow>=12.2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
